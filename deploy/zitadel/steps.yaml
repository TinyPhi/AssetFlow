# Zitadel first-instance setup steps (§B5.5, §B11.2).
# Reference: https://zitadel.com/docs/self-hosting/manage/configure
# No secrets here. The admin password comes from the OpenBao-rendered file
# /run/zitadel/zitadel-steps-secrets.yaml (second --steps).

FirstInstance:
  # Key of the tofu-admin machine user, read once by scripts/zitadel-apply.py,
  # stored in OpenBao (secret/assetflow/zitadel/tofu-admin-key) and then deleted.
  MachineKeyPath: /zitadel/bootstrap/tofu-admin-key.json
  Org:
    # Platform organization: owns the AssetFlow project (§B5.5).
    Name: AssetFlow Platform
    Human:
      UserName: admin
      FirstName: Platform
      LastName: Admin
      Email:
        Address: admin@example.com
        Verified: true
      PasswordChangeRequired: true
    Machine:
      Machine:
        Username: tofu-admin
        Name: OpenTofu administration
      MachineKey:
        # 1 = JSON key file
        Type: 1
