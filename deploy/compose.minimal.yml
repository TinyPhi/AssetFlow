# AssetFlow minimal profile (§B13.1, M1.6-T7).
#
# Minimal development & demo stack:
#   - postgres: database with RLS and schema
#   - mailpit: local email testing & inbox
#   - api: FastAPI backend (mock auth, file secrets, inmemory events)
#   - web: Nginx web shell & reverse proxy to API
#
# Non-root, read-only containers with tmpfs and strict resource bounds.

name: assetflow-minimal

services:
  postgres:
    labels:
      com.tinyphi.project: assetflow
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-assetflow}
      POSTGRES_USER: ${DATABASE_USER:-assetflow_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-assetflow_dev_password}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres_minimal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-assetflow_app} -d ${DATABASE_NAME:-assetflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assetflow_minimal_net

  mailpit:
    container_name: af-mailpit
    labels:
      com.tinyphi.project: assetflow
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-18025}:8025"
    networks:
      - assetflow_minimal_net

  api:
    labels:
      com.tinyphi.project: assetflow
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASSETFLOW_ENV: development
      ASSETFLOW_AUTH_PROVIDER: mock
      ASSETFLOW_SECRETS_PROVIDER: file
      ASSETFLOW_TELEMETRY_PROVIDER: noop
      ASSETFLOW_EVENTS_PROVIDER: inmemory
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-assetflow}
      DATABASE_USER: ${DATABASE_USER:-assetflow_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-assetflow_dev_password}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - assetflow_minimal_net

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: af-worker
    labels:
      com.tinyphi.project: assetflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/.venv/bin/python", "-m", "workers.main"]
    environment:
      ASSETFLOW_ENV: development
      ASSETFLOW_CONFIG: /config/assetflow.yaml
      ASSETFLOW_SECRETS_DIR: /run/secrets
      ASSETFLOW_DB_HOST: postgres
      ASSETFLOW_DB_PORT: 5432
      ASSETFLOW_DB_NAME: ${DATABASE_NAME:-assetflow}
    # Only the worker's own database password is mounted; no other secret reaches this container.
    volumes:
      - ../config:/config:ro
      - ../.secrets/database/worker/password:/run/secrets/database/worker/password:ro
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "workers.main", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - assetflow_minimal_net

  web:
    labels:
      com.tinyphi.project: assetflow
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - assetflow_minimal_net

  migrate:
    labels:
      com.tinyphi.project: assetflow
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASSETFLOW_ENV: development
      ASSETFLOW_MIGRATION_DATABASE_URL: postgresql://${DATABASE_USER:-assetflow_app}:${DATABASE_PASSWORD:-assetflow_dev_password}@postgres:5432/${DATABASE_NAME:-assetflow}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-assetflow}
      DATABASE_USER: ${DATABASE_USER:-assetflow_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-assetflow_dev_password}
    entrypoint: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    networks:
      - assetflow_minimal_net
    profiles:
      - tools

volumes:
  postgres_minimal_data:

networks:
  assetflow_minimal_net:
    driver: bridge
