# AssetFlow minimal profile (§B13.1, M1.6-T7).
#
# Minimal development & demo stack:
#   - postgres: database with RLS and roles
#   - migrate: one-shot Alembic migration as the migrator role
#   - mailpit: local email testing & inbox
#   - api: FastAPI backend (mock auth, file secrets, inmemory events)
#   - web: Nginx web shell & reverse proxy to API
#
# Non-root, read-only containers with tmpfs and strict resource bounds.
#
# Isolation from other projects on the same machine: containers, the network and the volume are
# namespaced by the compose project (the Makefile passes `-p assetflow`), and the host ports below
# are AssetFlow-specific (web 18080, database 15432, Mailpit 11025 and 18025), not the common
# 8080 / 5432 / 1025 / 8025. Override with WEB_PORT, DATABASE_PORT, MAILPIT_SMTP_PORT, MAILPIT_UI_PORT.

name: assetflow

x-assetflow-labels: &assetflow-labels
  com.tinyphi.project: assetflow
  com.tinyphi.profile: minimal

services:
  postgres:
    labels: *assetflow-labels
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ASSETFLOW_DB_NAME:-assetflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/database/postgres/password
    ports:
      - "127.0.0.1:${DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres_minimal_data:/var/lib/postgresql/data
      # Only the database credentials the init script reads, not the whole secrets directory.
      - ../.secrets/database:/run/secrets/database:ro
      - ./postgres/init-minimal.sh:/docker-entrypoint-initdb.d/01-init-minimal.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${ASSETFLOW_DB_NAME:-assetflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - assetflow_minimal_net

  mailpit:
    labels: *assetflow-labels
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    networks:
      - assetflow_minimal_net

  migrate:
    labels: *assetflow-labels
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASSETFLOW_DB_NAME: ${ASSETFLOW_DB_NAME:-assetflow}
    volumes:
      # The migrator password only.
      - ../.secrets/database/migrator:/run/secrets/database/migrator:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        MIGRATOR_PW=$$(cat /run/secrets/database/migrator/password)
        export ASSETFLOW_MIGRATION_DATABASE_URL="postgresql://assetflow_migrator_user:$${MIGRATOR_PW}@postgres:5432/$${ASSETFLOW_DB_NAME:-assetflow}"
        exec uv run --no-sync alembic upgrade head
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - assetflow_minimal_net

  api:
    labels: *assetflow-labels
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASSETFLOW_CONFIG: /app/config/assetflow.yaml
      ASSETFLOW_ENV: development
      ASSETFLOW_AUTH_PROVIDER: mock
      ASSETFLOW_SECRETS_PROVIDER: file
      ASSETFLOW_TELEMETRY_PROVIDER: noop
      ASSETFLOW_EVENTS_PROVIDER: inmemory
      ASSETFLOW_DB_HOST: postgres
      ASSETFLOW_DB_PORT: "5432"
      ASSETFLOW_DB_NAME: ${ASSETFLOW_DB_NAME:-assetflow}
      ASSETFLOW_DB_API_USER: assetflow_api_user
      ASSETFLOW_DB_WORKER_USER: assetflow_worker_user
      ASSETFLOW_DB_MIGRATOR_USER: assetflow_migrator_user
      ASSETFLOW_SECRETS_DIR: /run/secrets
    volumes:
      - ../config:/app/config:ro
      # The api password and the field-encryption key only (not the superuser or migrator passwords).
      - ../.secrets/database/api:/run/secrets/database/api:ro
      - ../.secrets/transit:/run/secrets/transit:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - assetflow_minimal_net

  web:
    labels: *assetflow-labels
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run
    networks:
      - assetflow_minimal_net

volumes:
  postgres_minimal_data:

networks:
  assetflow_minimal_net:
    driver: bridge
