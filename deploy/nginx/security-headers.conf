# Security response headers (§C5.10), the only place they are defined. Every `location` includes
# this file: nginx drops every header inherited from the server block as soon as a location sets
# an add_header of its own, so a header listed only at server level silently vanishes there (AF-032).
# The server block sets $csp (it differs per deployment); everything else is fixed here.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy $csp always;
