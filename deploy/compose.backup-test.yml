# Local S3-compatible test object store with Object Lock support (§B13.5, M1.6-T9).
# For testing and restore drills only; never used in production.

services:
  objectstore:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: af-objectstore
    labels:
      com.tinyphi.project: assetflow
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_KEY:-backupadmin}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET:-backupsecret123}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  objectstore_data:
