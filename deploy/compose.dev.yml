# AssetFlow local development stack (`make dev`, scripts/dev.sh, scripts/dev.ps1).
# LOCAL DEVELOPMENT ONLY. Production uses deploy/compose.full.yml.
#
# Always on (6):  af-postgres, af-openbao, af-zitadel, af-api, af-worker, af-web
# Optional:       af-mailpit (--profile mail), af-otel (--profile observability)
# One-shot:       af-setup (`docker compose run --rm`, backend image, never started by `up`)
#
# Start order, driven by scripts/dev.sh (every step waits for the health check before the next):
#   openbao up -> af-setup openbao (init/unseal with the local dev key, openbao-apply, bootstrap
#   files) -> postgres -> zitadel -> af-setup zitadel (zitadel-apply) -> af-setup migrate ->
#   api, worker, web.
#
# Credentials: generated by af-setup and stored in OpenBao, the only source of truth. Only the two
# bootstrap values that PostgreSQL and Zitadel need at first start (superuser password, masterkey and
# the Zitadel database and first-admin passwords) are copied into the volume
# assetflow_runtime_secrets, which containers mount read-only and read through *_FILE variables or
# --masterkeyFile. api and worker get only their own AppRole login (role id, secret id) and a
# generated config file from that volume, and read every credential from OpenBao at boot.
# No credential is placed in an environment variable, a .env file, an image or the repository.
# Values interpolated below (${...}) are non-secret settings (ports, URLs).
#
# Names: every container is af-<service>, every volume and network starts with assetflow_, and
# everything carries the label com.tinyphi.project=assetflow. Host ports are above 9000.
#
# References:
#   https://openbao.org/docs/configuration/
#   https://zitadel.com/docs/self-hosting/deploy/compose

name: assetflow

x-labels: &labels
  com.tinyphi.project: assetflow

x-backend: &backend
  image: assetflow-backend:dev
  build:
    context: ../backend
    dockerfile: Dockerfile
    labels: *labels
  labels: *labels

# Browser and API URLs. The browser reaches Zitadel at ZITADEL_DOMAIN:ZITADEL_EXTERNALPORT
# (*.localhost resolves to the loopback address in every current browser); containers reach the
# same name through a network alias, so the issuer URL is identical for both.
x-zitadel-external: &zitadel-external
  ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-zitadel.localhost}
  ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-19081}
  ZITADEL_EXTERNALSECURE: "false"

services:
  # ---------------------------------------------------------------- database
  # One server, two databases (assetflow, zitadel) and separate roles. The zitadel database and its
  # role are created by Zitadel's own init step.
  postgres:
    container_name: af-postgres
    image: postgres:16-alpine
    labels: *labels
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: assetflow
      POSTGRES_PASSWORD_FILE: /run/af/postgres-password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: volume
        source: runtime_secrets
        target: /run/af
        read_only: true
        volume:
          subpath: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - net

  # ---------------------------------------------------------------- secrets
  # Server mode with file storage. Healthy as soon as the server answers (also while sealed);
  # af-setup initializes and unseals it with the local dev key.
  openbao:
    container_name: af-openbao
    image: openbao/openbao:2.6.3
    labels: *labels
    restart: unless-stopped
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${OPENBAO_HOST_PORT:-19200}:8200"
    volumes:
      - ./openbao/dev/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao_data:/openbao/file
    healthcheck:
      # `bao status`: 0 unsealed, 2 sealed, 1 unreachable. Sealed is fine here.
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; test $$? -ne 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - net

  # ---------------------------------------------------------------- identity
  zitadel:
    container_name: af-zitadel
    image: ghcr.io/zitadel/zitadel:v4.19.3
    labels: *labels
    restart: unless-stopped
    command:
      - start-from-init
      - --masterkeyFile
      - /run/af/masterkey
      - --tlsMode
      - disabled
      - --config
      - /zitadel/config.yaml
      - --config
      - /run/af/zitadel-secrets.yaml
      - --steps
      - /zitadel/steps.yaml
      - --steps
      - /run/af/zitadel-steps-secrets.yaml
    environment:
      <<: *zitadel-external
      # The same port inside and outside, so the issuer URL works from the host and the network.
      ZITADEL_PORT: ${ZITADEL_EXTERNALPORT:-19081}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      # DEV ONLY relaxations (production keeps the strict defaults of deploy/zitadel/*.yaml).
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_FORCEMFA: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
    ports:
      - "127.0.0.1:${ZITADEL_EXTERNALPORT:-19081}:${ZITADEL_EXTERNALPORT:-19081}"
    volumes:
      - ./zitadel/config.yaml:/zitadel/config.yaml:ro
      - ./zitadel/steps.yaml:/zitadel/steps.yaml:ro
      - zitadel_bootstrap:/zitadel/bootstrap
      - type: volume
        source: runtime_secrets
        target: /run/af
        read_only: true
        volume:
          subpath: zitadel
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Distroless image: the built-in readiness command. It reads the config and environment.
      test: ["CMD", "/app/zitadel", "ready", "--config", "/zitadel/config.yaml"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 30s
    networks:
      net:
        aliases:
          - ${ZITADEL_DOMAIN:-zitadel.localhost}

  # ---------------------------------------------------------------- AssetFlow
  api:
    <<: *backend
    container_name: af-api
    restart: unless-stopped
    # Bypasses `uv run` (its ENTRYPOINT): read_only mode gives it nowhere to write a cache dir, and
    # the image's venv is already synced, so uvicorn is started from it directly, as af-worker does.
    entrypoint: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      ASSETFLOW_ENV: development
      # Generated by af-setup: provider settings, database users and secret:// references only.
      ASSETFLOW_CONFIG: /run/af/assetflow.yaml
      ASSETFLOW_DB_HOST: postgres
      ASSETFLOW_DB_PORT: "5432"
      ASSETFLOW_DB_NAME: assetflow
      ASSETFLOW_PUBLIC_URL: ${APP_URL:-http://localhost:18080}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18090}:8080"
    volumes:
      # config/domains for the automation subscriber (the image has no config folder).
      - ../config:/config:ro
      - type: volume
        source: runtime_secrets
        target: /run/af
        read_only: true
        volume:
          subpath: assetflow-api
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      openbao:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - net

  worker:
    <<: *backend
    container_name: af-worker
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "workers.main"]
    environment:
      ASSETFLOW_ENV: development
      ASSETFLOW_CONFIG: /run/af/assetflow.yaml
      ASSETFLOW_DB_HOST: postgres
      ASSETFLOW_DB_PORT: "5432"
      ASSETFLOW_DB_NAME: assetflow
    volumes:
      - ../config:/config:ro
      - type: volume
        source: runtime_secrets
        target: /run/af
        read_only: true
        volume:
          subpath: assetflow-worker
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      openbao:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "workers.main", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - net

  # nginx serving the SPA and proxying /api (as in production). `WEB=vite` skips this service.
  web:
    container_name: af-web
    image: assetflow-web:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
      labels: *labels
    labels: *labels
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged runs as uid 101: a bare tmpfs mount defaults to root-owned, so nginx could
    # not create its own subdirectories there (mkdir() ... Permission denied).
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    healthcheck:
      # The image's own HEALTHCHECK probes "localhost", which this container resolves to ::1 first;
      # default.conf only listens on IPv4 (deploy/nginx/default.conf), so that probe always refuses.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - net

  # ---------------------------------------------------------------- optional
  mailpit:
    container_name: af-mailpit
    image: axllent/mailpit:v1.21.8
    labels: *labels
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-18025}:8025"
    networks:
      - net

  otel:
    container_name: af-otel
    image: grafana/otel-lgtm:0.11.0
    labels: *labels
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-14317}:4317"
    volumes:
      - otel_data:/data
    networks:
      - net

  # ---------------------------------------------------------------- one-shot setup
  # docker compose run --rm --no-deps --name af-setup setup <openbao|zitadel|migrate>
  # Runs as root only to initialize volume ownership; it exits and is removed after each step.
  # The OpenBao token never enters the container configuration: af-setup reads it from the dev key
  # volume and hands it to the child processes in memory.
  setup:
    <<: *backend
    profiles: [setup]
    restart: "no"
    user: "0"
    working_dir: /app
    entrypoint: ["/app/.venv/bin/python", "/workspace/scripts/dev_setup.py"]
    environment:
      <<: *zitadel-external
      ASSETFLOW_ENV: development
      ASSETFLOW_ROOT: /workspace
      BAO_ADDR: http://openbao:8200
      ZITADEL_BOOTSTRAP_URL: http://zitadel:${ZITADEL_EXTERNALPORT:-19081}
      APP_URL: ${APP_URL:-http://localhost:18080}
      API_URL: ${API_URL:-http://localhost:18080}
      ASSETFLOW_NET_CIDR: ${ASSETFLOW_NET_CIDR:-172.29.28.0/24}
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_DOWNLOADS: never
    volumes:
      - ../scripts:/workspace/scripts:ro
      - ../config:/workspace/config:ro
      - ./openbao:/workspace/deploy/openbao:ro
      - runtime_secrets:/run/af-runtime
      - openbao_dev_keys:/run/af-keys
      - zitadel_bootstrap:/zitadel/bootstrap
    networks:
      - net

volumes:
  postgres_data:
    name: assetflow_postgres_data
    labels: *labels
  openbao_data:
    name: assetflow_openbao_data
    labels: *labels
  # Local dev unseal key and root token of af-openbao. Mounted only by af-setup.
  openbao_dev_keys:
    name: assetflow_openbao_dev_keys
    labels: *labels
  # Bootstrap values for PostgreSQL and Zitadel, AppRole logins and generated configs. Read-only
  # for every long-running container; written only by af-setup.
  runtime_secrets:
    name: assetflow_runtime_secrets
    labels: *labels
  zitadel_bootstrap:
    name: assetflow_zitadel_bootstrap
    labels: *labels
  otel_data:
    name: assetflow_otel_data
    labels: *labels

networks:
  net:
    name: assetflow_net
    labels: *labels
    driver: bridge
    ipam:
      config:
        # AppRole secret ids and tokens are bound to this range (scripts/openbao-apply.py).
        - subnet: ${ASSETFLOW_NET_CIDR:-172.29.28.0/24}
