# Backup overlay service (pgBackRest) (§B13.1, §B13.5, M1.6-T9).
# Usable with both minimal and full profiles:
#   docker compose -p assetflow -f deploy/compose.minimal.yml -f deploy/compose.backup.yml up -d

services:
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: af-backup
    labels:
      com.tinyphi.project: assetflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The rendered config (backup-daemon.sh writes it to tmpfs). Set here, not only in the daemon,
      # so `docker compose exec backup pgbackrest ...` (scripts/restore.sh) reads the same file.
      PGBACKREST_CONFIG: /tmp/pgbackrest.conf
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DATABASE_USER:-assetflow_app}
      # No defaults for credentials: a known passphrase would encrypt real backups (ASVS V14.1.1).
      BACKUP_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?set BACKUP_CIPHER_PASS (see .env.example)}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-af-objectstore:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-assetflow-backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:?set BACKUP_S3_KEY (see .env.example)}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:?set BACKUP_S3_SECRET (see .env.example)}
      # Optional: size budget of the object-store bucket; repo_used_ratio is reported only when set.
      BACKUP_REPO_QUOTA_BYTES: ${BACKUP_REPO_QUOTA_BYTES:-}
      # WAL archive lag is read from pg_stat_archiver with the database login above.
      POSTGRES_DB: ${DATABASE_NAME:-assetflow}
      PGPASSWORD: ${DATABASE_PASSWORD:-}
    volumes:
      # A template: backup-daemon.sh renders it to /tmp/pgbackrest.conf (tmpfs) before any call.
      - ./backup/pgbackrest.conf.template:/etc/pgbackrest/pgbackrest.conf.template:ro
      - wal_archive:/var/lib/postgresql/archive
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/spool/pgbackrest:size=512M,uid=10001,gid=10001
      - /var/log/pgbackrest:size=64M,uid=10001,gid=10001

volumes:
  wal_archive:
