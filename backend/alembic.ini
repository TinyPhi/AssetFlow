# Alembic Migration Configuration (§B10, §C4.8, §C5.4)

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
prepend_sys_path = .
# The database URL is never stored here: env.py reads ASSETFLOW_MIGRATION_DATABASE_URL (the migrator DSN).
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
