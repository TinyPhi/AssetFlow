# Sample AssetFlow organization (§B5.5, decision 52). Neutral example name, not a real company.
# Applied to Zitadel by make zitadel-apply (deploy/zitadel/tofu/organizations.tf): one Zitadel
# organization plus a project grant for AssetFlow with the roles below. The slug must equal
# the file name. The Zitadel organization id is assigned by Zitadel; zitadel-apply prints it
# (output organization_ids) and "assetflow org create --idp-org <id>" stores it in
# organizations.idp_organization_id. Tokens carry it in urn:zitadel:iam:user:resourceowner:id.

slug: example-beta
name: Example Beta
description: Sample organization B for local development and isolation tests
settings:
  timezone: UTC
  currency: EUR
  locale: en-GB
idp:
  provider: zitadel
  # Roles this organization may assign to its members (subset of the AssetFlow project roles).
  granted_roles:
    - viewer
    - technician
    - asset_manager
    - admin
