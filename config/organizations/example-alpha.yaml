# Sample AssetFlow organization (§B5.5, decision 52). Neutral example name, not a real company.
# Applied to Zitadel by make zitadel-apply (scripts/bootstrap_zitadel.py): one Zitadel
# organization plus a project grant for AssetFlow with the roles below. The slug must equal
# the file name. The Zitadel organization id is assigned by Zitadel; the bootstrap prints it and
# stores it in ZITADEL_ORGANIZATIONS (.env.local) or secret/assetflow/zitadel/organizations
# (production), and "assetflow org create --idp-org <id>" stores it in
# organizations.idp_organization_id. Tokens carry it in urn:zitadel:iam:user:resourceowner:id.

slug: example-alpha
name: Example Alpha
description: Sample organization A for local development and isolation tests
settings:
  timezone: UTC
  currency: USD
  locale: en-US
idp:
  provider: zitadel
  # Roles this organization may assign to its members (subset of the AssetFlow project roles).
  granted_roles:
    - viewer
    - technician
    - team_lead
    - asset_manager
    - maintenance_planner
    - org_unit_manager
    - admin
