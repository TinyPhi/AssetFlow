# AssetFlow platform configuration (§B7.2, decision 51). Validate with: make config-validate
# This file never contains secret values: only secret://<area>/<name>#<key> references (§C1.6)
# and ${ASSETFLOW_*} / standard environment variables. Production refuses mock auth, file
# secrets and any database password that is not a secret:// reference (§B6.1 rule 6).
# These defaults are for local development; production installs override them per deployment.

env: "${ASSETFLOW_ENV:-development}"

platform:
  admins: []
  allow_open_provisioning: false
  public_url: "${ASSETFLOW_PUBLIC_URL:-http://localhost:5173}"
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:18080"

providers:
  auth:
    type: "${ASSETFLOW_AUTH_PROVIDER:-mock}"
    settings: {}
  secrets:
    type: "${ASSETFLOW_SECRETS_PROVIDER:-file}"
    settings:
      # Relative to this file's folder: <repo>/.secrets (git-ignored).
      directory: "${ASSETFLOW_SECRETS_DIR:-../.secrets}"
      # 32-byte AES-256-GCM key (raw or base64) inside the secrets directory; needed only for
      # field encryption.
      encryption_key_file: "transit/file.key"
      # Also read ASSETFLOW_SECRET_<AREA>_<NAME>_<KEY> environment variables (dev/test/CI).
      allow_env: true
  telemetry:
    type: "${ASSETFLOW_TELEMETRY_PROVIDER:-noop}"
    settings: {}
  events:
    type: "${ASSETFLOW_EVENTS_PROVIDER:-inmemory}"
    settings: {}

database:
  host: "${ASSETFLOW_DB_HOST:-localhost}"
  port: "${ASSETFLOW_DB_PORT:-5432}"
  name: "${ASSETFLOW_DB_NAME:-assetflow}"
  api:
    user: "assetflow_api"
    password: "secret://database/api#password"
  worker:
    user: "assetflow_worker"
    password: "secret://database/worker#password"
  migrator:
    user: "assetflow_migrator"
    password: "secret://database/migrator#password"
  behind_pgbouncer: false
  statement_timeout_ms: 15000
  idle_in_transaction_timeout_ms: 30000
  pool_min: 1
  pool_max: 10

workers:
  outbox:
    batch_size: 50
    poll_interval_seconds: 2
    reclaim_after_seconds: 300
    max_attempts: 5
  heartbeat_file: "/tmp/af-worker-heartbeat"

notifications:
  channels:
    inapp:
      retention_days: 180
    email:
      # The installation-wide SMTP relay. In development it is the Mailpit container; production
      # needs a real relay with security: starttls (or tls) and a secret:// password.
      enabled: true
      host: ${ASSETFLOW_SMTP_HOST:-mailpit}
      port: ${ASSETFLOW_SMTP_PORT:-1025}
      security: none
      allow_private_addresses: true
      default_from: noreply@assetflow.local
      timeout_seconds: 10
