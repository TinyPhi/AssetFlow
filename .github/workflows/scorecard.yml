#
# OpenSSF Scorecard (master plan §C9.2). Results are published (badge, API) only
# when the repository is public. SARIF goes to the security tab when code scanning
# is available (public, or ASSETFLOW_GHAS_ENABLED == "true"); it is always kept as
# a run artifact. The scorecard-action job must contain only `uses` steps.

name: Scorecard

on:
  schedule:
    - cron: "30 1 * * 1" # weekly, Monday 01:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to the security tab
      id-token: write # publish results (public repository only)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.visibility == 'public' }}

      - name: Keep SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to the security tab
        if: github.event.repository.visibility == 'public' || vars.ASSETFLOW_GHAS_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
