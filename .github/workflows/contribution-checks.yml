#
# Contribution guardrails (master plan §C9.4). Runs on `pull_request` only, with a
# read-only token and no secrets. PR title and body reach the script through
# environment variables, never through inline `${{ }}` in the shell.

name: Contribution checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  contribution-checks:
    name: Contribution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run contribution guardrails
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # scripts/check-contribution-guardrails.sh --base <PR base SHA> (§C9.4)
        run: make ci-contribution-checks BASE="${BASE_SHA}"
