#
# CLA check (master plan §C9.2, M1.2-T7). `pull_request_target` is used only so the
# check can comment and set a status on fork PRs; this workflow NEVER checks out or
# runs PR code (§C9.1). Only the built-in GITHUB_TOKEN is used; no stored secrets.
# This job calls no make target on purpose: it runs no repository code at all.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  cla:
    name: CLA check
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # re-run the check after a signature comment
      contents: write # commit the signature file in this repository
      pull-requests: write # comment on the PR
      statuses: write # set the CLA commit status
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "TinyPhi,dependabot[bot],github-actions[bot]"
