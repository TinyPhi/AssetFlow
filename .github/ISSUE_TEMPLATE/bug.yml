name: Bug Report
description: Create a report to help us reproduce and fix a bug in AssetFlow.
title: "fix: "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure this is not a security vulnerability. If it is security-sensitive, email **security@tinyphi.com** per [SECURITY.md](../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: AssetFlow Version
      description: What version or git commit SHA of AssetFlow are you running?
      placeholder: e.g., v1.0.0 or commit 3a4f8b1
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Deployment Profile
      description: Which deployment profile is affected?
      options:
        - "compose.minimal (Single node, Postgres, Mailpit)"
        - "compose.full (PgBouncer, Zitadel, OpenBao, Otel)"
        - "Kubernetes / Custom production"
        - "Local development (uv / npm run dev)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed, step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Log in as organization administrator.
        2. Navigate to '...'
        3. Click on '...'
        4. See error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages or HTTP status codes).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Environment & Relevant Logs
      description: Please paste sanitized logs (NEVER include passwords, tokens, API keys, or personal data).
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Verification Checklist
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have confirmed that no secrets, credentials, or PII are in the logs above.
          required: true
